id: stop.llm-provider-missing-moderation-ts
language: typescript
severity: info
message: |-
  LLM call in this function has no input/output moderation classifier. No guardrail
  layer on the prompt or response. (Advisory: moderation often lives at a different
  layer - confirm there's a guardrail somewhere on this path.)
  Architectural fix: wrap LLM calls with a moderation classifier (Llama Guard,
  OpenAI Moderation, Bedrock Guardrails) (Shift 3).
metadata:
  shift: stop
  component: control-flow
  confidence: low
  # Severity is deliberately `info`, matching the Python variant. This is an
  # ABSENCE-based rule with a FUNCTION-scoped exculpation, so it is structurally
  # blind to moderation implemented anywhere else - an API gateway, middleware, a
  # provider-side guardrail attached at model-config time, or a separate service.
  # That is where moderation usually lives, so a deterministic Failed driven by this
  # rule would be a false accusation by construction. It stays advisory input to the
  # judge, which can reason across files and layers. See the Python variant.
  framework: meta-llamaguard
  references:
    - https://ai.meta.com/research/publications/llama-guard-llm-based-input-output-safeguard-for-human-ai-conversations/
    - https://platform.openai.com/docs/guides/moderation
rule:
  all:
    - any:
        - kind: function_declaration
        - kind: arrow_function
        - kind: method_definition
        - kind: function_expression
    - has:
        stopBy: end
        any:
          - pattern: streamText($$$)
          - pattern: generateText($$$)
          - pattern: streamObject($$$)
          - pattern: generateObject($$$)
          - pattern: $CLIENT.chat.completions.create($$$)
          - pattern: $CLIENT.messages.create($$$)
          - pattern: $CLIENT.responses.create($$$)
          - pattern: $CLIENT.generateContent($$$)
    - not:
        has:
          stopBy: end
          any:
            - pattern: $$$.moderations.create($$$)
            - pattern: moderate($$$)
            - pattern: $$$.moderate($$$)
            - pattern: LlamaGuard($$$)
            - pattern: PromptGuard($$$)
            - pattern: classify($$$)
            - pattern: $$$.classify($$$)
            - pattern: applyGuardrail($$$)
            - pattern: $$$.applyGuardrail($$$)
