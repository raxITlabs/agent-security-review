id: sign.hardcoded-credential-literal
language: python
severity: error
message: |-
  Hardcoded credential literal in source. Survives prompt injection because it is baked in.
  Architectural fix: load from a secrets manager / KMS with per-task scope (Shift 2).
metadata:
  shift: sign
  component: identity
  framework: aws-iam-best-practices
  references:
    - https://docs.aws.amazon.com/secretsmanager/latest/userguide/best-practices.html
rule:
  any:
    - all:
        - pattern: $VAR = $VAL
        - has:
            field: left
            regex: '(?i)(api_?key|apikey|password|passwd|pwd|secret|secret_?key|secretkey|token|auth_?token|access_?key|access_?token|private_?key|client_?secret|credential)$'
        - not:
            has:
              field: left
              regex: &counter_names '(?i)(encoding|prompt|max|min|num|count|total|input|output|completion|context|chunk|budget|limit|usage|start|end|stop|special|pad|eos|bos|sep|cls|unk|mask|begin|reset|refresh)_(token|key)s?$'
    - all:
        - kind: keyword_argument
        - has:
            field: name
            regex: '(?i)^(api_?key|apikey|password|passwd|pwd|secret|secret_?key|secretkey|token|auth_?token|access_?key|access_?token|private_?key|client_?secret|credential)$'
        - not:
            has:
              field: name
              regex: *counter_names
        - has:
            field: value
            pattern: $VAL
    - all:
        - kind: pair
        - has:
            field: key
            regex: '(?i)(api_?key|apikey|password|passwd|pwd|secret|secret_?key|secretkey|token|auth_?token|access_?key|access_?token|private_?key|client_?secret|credential)'
        - not:
            has:
              field: key
              regex: *counter_names
        - has:
            field: value
            pattern: $VAL
constraints:
  VAL:
    all:
      - kind: string
      - regex: '\S{10,}'
      # Prose, not a credential. A real secret has no internal whitespace, so any
      # whitespace in the literal means it is a sentence: an error message, a help
      # string, a validation hint. This is what let
      #   client_secret = "Must be valid Azure application secret"
      # through. Trade-off: a passphrase-style credential containing spaces is now
      # missed. Accepted deliberately — gitleaks covers high-entropy values, and a
      # false accusation costs more than a miss on a rule feeding a deterministic
      # verdict.
      - not:
          regex: '\s'
      # SCREAMING_SNAKE_CASE value = the NAME of an env var / config key, not its
      # value. `authSecret: 'LITEBEAM_API_KEY'` names where the secret comes from;
      # it is not the secret. Requires at least one underscore ON PURPOSE, so that
      # all-caps credentials with no underscore — an AWS access key id such as
      # AKIAIOSFODNN7EXAMPLE — are still caught.
      - not:
          regex: '^["''][A-Z][A-Z0-9]*(_[A-Z0-9]+)+["'']$'
      - not:
          regex: '(?i)(your|example|changeme|placeholder|dummy|sample|redacted|xxxx|\$\{|os\.environ|process\.env|getenv|none|null)'
      # --- PRECISION (2026-07): identifier-shaped values that are not secrets. ---
      # A credential-ish NAME bound to a value that is demonstrably an infrastructure
      # identifier, ARN, URL, filesystem path or registry slug is a naming artifact,
      # not a leaked secret. Each guard below is shape-based so it cannot swallow a
      # real high-entropy key.
      # ARNs: token = "arn:aws:iam::123456789012:role/Foo"
      - not:
          regex: '(?i)["'']arn:'
      # URLs of any scheme: api_key = "https://…", secret = "s3://…"
      - not:
          regex: '(?i)["''][a-z][a-z0-9+.-]*://'
      # Filesystem paths: secret = "/etc/agent/key", "./conf", "../conf", "~/.aws"
      - not:
          regex: '^["''](/|\./|\.\./|~/)'
      # Cloud resource IDs: access_key = "fsap-0a1b2c3d…", token = "fs-0123…".
      # <prefix>-<hex> is an AWS/GCP resource handle, never a credential.
      - not:
          regex: '(?i)["''](fsap|fs|subnet|vpc|sg|ami|acl|eni|igw|rtb|nat|vol|snap|pcx|tgw|db|i)-[0-9a-f]{6,}["'']'
      # Registry / dataset / model slugs: token = "openai/gsm8k-main-test".
      # Deliberately ALL-LOWERCASE: real base64 secrets (e.g. an AWS secret access
      # key, which legitimately contains "/") carry mixed case, so they still fire.
      - not:
          regex: '^["''][a-z0-9._-]+/[a-z0-9._/-]+["'']$'
      # Tokenizer special tokens: token = "<|endoftext|>", "<pad>", "[CLS]"
      - not:
          regex: '^["''](<\||<[a-z_]+>|\[[A-Z]+\])'
