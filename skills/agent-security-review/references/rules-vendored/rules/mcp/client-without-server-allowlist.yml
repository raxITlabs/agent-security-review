id: sign.mcp-client-without-server-allowlist
language: python
severity: warning
message: |-
  MCP client is constructed from a variable server config, with no allowlist check visible in this
  function. The client will connect to whatever endpoint that variable resolves to.

  READ THIS BEFORE TRIAGING — what this finding is NOT:
  This rule fires at the CLIENT CONSTRUCTOR, which cannot tell you where the config came from. A
  safe client built from a server-side registry and a vulnerable one built from a request payload
  are the same expression here. Treat this as "endpoint trust is unverified at this call site",
  advisory only — NOT as evidence of remote code execution.

  If the config selects a stdio transport, the config also carries command/args/env, and an MCP
  stdio server is a LOCAL PROCESS SPAWN — whoever controls that dict controls argv. That is a far
  more severe and separately detectable defect, so it has its own precise rule:
  `scope.mcp-stdio-spawn-from-external-config`, which anchors on the command/args/env assignment
  rather than the constructor. If that rule also fired in this codebase, triage IT first and treat
  this finding as secondary.

  Architectural fix: keep an immutable server-side registry of approved MCP servers; let callers
  pass only a server NAME that indexes it. Never accept a URL — or a spawn recipe — from a
  caller (Shift 2).
metadata:
  shift: sign
  component: mcp
  confidence: advisory
  # Deliberately advisory, not high. The constructor site carries no information about whether the
  # server config crossed a trust boundary; whether this rule fires depends on incidental syntax
  # (a bare identifier argument fires, an inline call expression does not) rather than on trust.
  # Verified against fixtures/precision/mcp_stdio_spawn_{external,trusted}.py: it fires on the
  # TRUSTED shape and misses the EXTERNAL one, i.e. at the constructor the safe and vulnerable
  # shapes are indistinguishable. Constructor-anchored gating was evaluated and is not possible —
  # the precise detector had to be anchored elsewhere. See the companion rule
  # rules/mcp/stdio-spawn-from-external-config.yml.
  related:
    - scope.mcp-stdio-spawn-from-external-config
  framework: msrc-prompts-become-shells
  references:
    - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    - https://modelcontextprotocol.io/specification/draft/basic/security_best_practices
rule:
  kind: call
  all:
    - any:
        - pattern: ClientSession($A)
        - pattern: MCPClient($A)
        - pattern: MultiServerMCPClient($A)
        - pattern: stdio_client($A)
        - pattern: sse_client($A)
        - pattern: streamablehttp_client($A)
        - pattern: streamable_http_client($A)
        - pattern: MCPServerSse($A)
        - pattern: MCPServerStdio($A)
        - pattern: MCPServerStreamableHttp($A)
        - pattern: Client($A)
    - has:
        field: arguments
        has:
          kind: identifier
    - not:
        has:
          stopBy: end
          kind: string
    - not:
        inside:
          stopBy: end
          kind: function_definition
          has:
            stopBy: end
            any:
              - pattern: $X in $ALLOW
              - pattern: ALLOWED_$$$
              - pattern: $$$.startswith($$$)
              - pattern: validate_url($$$)
              - pattern: urlparse($$$)
